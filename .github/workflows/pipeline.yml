api-tests:
  name: API E2E Tests (Curl)
  runs-on: ubuntu-latest
  needs: [test, lint-quality]
  steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Install Dependencies
      run: npm ci

    - name: Start API
      run: npm start &

    - name: Run API Tests (Smoke, Sanity, Regression)
      run: bash scripts/api-tests.sh